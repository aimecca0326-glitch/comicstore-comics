<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코믹툰 주문알림</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1C8B6B">
<link rel="icon" href="./icon-192.png">
<style>
  :root{
    --바탕:#F5F6F8; --판:#FFFFFF; --글:#232833; --흐림:#5C6472; --더흐림:#6F7787;
    --줄:#E4E7EC; --줄2:#D0D5DD; --도장:#1C8B6B; --도장연:#EAF6F2; --붉음:#D14356;
    --붉음연:#FDEEF0; --그늘:0 1px 2px rgba(16,24,40,.06);
    --글꼴:Pretendard,"Segoe UI","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--바탕:#12161d;--판:#1a2029;--글:#e9edf3;--흐림:#a3adbb;--더흐림:#8b95a4;
          --줄:#28303c;--줄2:#39424f;--도장:#4fd1a5;--도장연:#132a22;
          --붉음:#f4778a;--붉음연:#2b171b;--그늘:0 1px 2px rgba(0,0,0,.3);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--바탕);color:var(--글);font-family:var(--글꼴);padding:22px 16px 44px}
  .가운데{max-width:520px;margin:0 auto}
  h1{font-size:21px;margin:0 0 4px}
  .부제{margin:0 0 20px;color:var(--더흐림);font-size:13px;line-height:1.6}
  .칸{background:var(--판);border:1px solid var(--줄);border-radius:12px;
      padding:16px;margin-bottom:12px;box-shadow:var(--그늘)}
  .상태{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800}
  .불{width:11px;height:11px;border-radius:50%;background:var(--줄2);flex:0 0 auto}
  .불.켬{background:var(--도장)}
  .불.끔{background:var(--붉음)}
  .설명{margin:9px 0 0;font-size:13px;color:var(--흐림);line-height:1.7}
  button{width:100%;margin-top:14px;padding:15px;font-size:16px;font-weight:800;
         border:0;border-radius:10px;background:var(--도장);color:#fff;cursor:pointer;
         font-family:var(--글꼴)}
  button.흐림{background:transparent;color:var(--흐림);border:1px solid var(--줄2)}
  button:disabled{opacity:.5}
  .요약{font-size:15px;line-height:1.8}
  .요약 b{font-size:18px}
  .알림글{margin-top:12px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.7;display:none}
  .알림글.좋음{display:block;background:var(--도장연);color:var(--도장)}
  .알림글.나쁨{display:block;background:var(--붉음연);color:var(--붉음)}
  h2{font-size:13px;color:var(--흐림);margin:24px 0 9px}
  .꼬리{margin-top:26px;padding-top:15px;border-top:1px solid var(--줄);
        font-size:12px;color:var(--더흐림);line-height:1.9}
  .꼬리 a{color:var(--도장)}
</style>
</head>
<body>
<div class="가운데">
  <h1>코믹툰 주문알림</h1>
  <p class="부제">새 주문이 들어오면 이 휴대폰으로 알려드립니다.<br>
     매장 컴퓨터에서 코믹검색이 돌고 있어야 합니다.</p>

  <div class="칸">
    <div class="상태"><span class="불" id="불"></span><span id="상태글">확인하는 중...</span></div>
    <p class="설명" id="설명"></p>
    <button id="켜기">알림 켜기</button>
    <button id="끄기" class="흐림" style="display:none">알림 끄기</button>
    <div class="알림글" id="말"></div>
  </div>

  <h2>마지막 알림</h2>
  <div class="칸">
    <div class="요약" id="요약">아직 없습니다.</div>
    <button class="흐림" id="새로">다시 읽기</button>
  </div>

  <div class="꼬리">
    이 화면을 <b>홈 화면에 추가</b>해 두시면 앱처럼 쓰실 수 있습니다.<br>
    업무 프로그램 모음은 <a href="../">comics.comicstore.co.kr</a> 에 있습니다.
  </div>
</div>

<script>
(function () {
  var 서버 = 'https://anyak-push.anyak-push.workers.dev';
  var 구독길 = 서버 + '/' + encodeURIComponent('주문') + '/' + encodeURIComponent('구독');
  var 취소길 = 서버 + '/' + encodeURIComponent('주문') + '/' + encodeURIComponent('구독취소');
  var 요약길 = 서버 + '/' + encodeURIComponent('주문') + '/' + encodeURIComponent('요약');

  var 불 = document.getElementById('불');
  var 상태글 = document.getElementById('상태글');
  var 설명 = document.getElementById('설명');
  var 켜기 = document.getElementById('켜기');
  var 끄기 = document.getElementById('끄기');
  var 말 = document.getElementById('말');

  function 알림(글, 좋은가) {
    말.textContent = 글;
    말.className = '알림글 ' + (좋은가 ? '좋음' : '나쁨');
  }
  function 지움() { 말.className = '알림글'; 말.textContent = ''; }

  function 그리기(켜짐, 설명글) {
    불.className = '불 ' + (켜짐 ? '켬' : '끔');
    상태글.textContent = 켜짐 ? '알림 켜져 있습니다' : '알림 꺼져 있습니다';
    설명.textContent = 설명글 || '';
    켜기.style.display = 켜짐 ? 'none' : 'block';
    끄기.style.display = 켜짐 ? 'block' : 'none';
  }

  function 쓸수있나() {
    if (!('serviceWorker' in navigator)) return '이 브라우저는 알림을 지원하지 않습니다.';
    if (!('PushManager' in window)) return '이 브라우저는 푸시 알림을 지원하지 않습니다.';
    if (location.protocol !== 'https:' && location.hostname !== 'localhost')
      return '알림은 https 주소에서만 됩니다.';
    return null;
  }

  function 열쇠바꾸기(글) {
    var 채움 = '===='.slice((글.length + 3) % 4);
    var 바른 = (글 + 채움).replace(/-/g, '+').replace(/_/g, '/');
    var 날것 = atob(바른);
    var 바이트 = new Uint8Array(날것.length);
    for (var i = 0; i < 날것.length; i++) 바이트[i] = 날것.charCodeAt(i);
    return 바이트;
  }

  async function 지금상태() {
    var 안됨 = 쓸수있나();
    if (안됨) { 그리기(false, 안됨); 켜기.disabled = true; return; }
    var 등록 = await navigator.serviceWorker.getRegistration('./');
    var 구독 = 등록 ? await 등록.pushManager.getSubscription() : null;
    if (구독 && Notification.permission === 'granted') {
      그리기(true, '이 휴대폰은 등록돼 있습니다.');
    } else if (Notification.permission === 'denied') {
      그리기(false, '이 브라우저에서 알림이 차단돼 있습니다. 주소창 옆 자물쇠를 눌러 알림을 허용으로 바꿔주세요.');
    } else {
      그리기(false, '아래 단추를 눌러 이 휴대폰을 등록하세요.');
    }
  }

  켜기.addEventListener('click', async function () {
    지움();
    켜기.disabled = true;
    켜기.textContent = '켜는 중...';
    try {
      var 허락 = await Notification.requestPermission();
      if (허락 !== 'granted') throw new Error('알림을 허용하셔야 받을 수 있습니다.');

      var 등록 = await navigator.serviceWorker.register('./sw.js', { scope: './' });
      await navigator.serviceWorker.ready;

      var 공개키 = (await (await fetch(서버 + '/key')).json()).publicKey;
      var 구독 = await 등록.pushManager.getSubscription();
      if (!구독) {
        구독 = await 등록.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: 열쇠바꾸기(공개키)
        });
      }
      var 답 = await (await fetch(구독길, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: 구독 })
      })).json();
      if (답.error) throw new Error(답.error);

      알림('등록됐습니다. 이제 새 주문이 오면 알려드립니다. (등록된 기기 ' + (답.등록된폰 || 1) + '대)', true);
    } catch (e) {
      알림(e.message || '알림을 켜지 못했습니다.', false);
    }
    켜기.disabled = false;
    켜기.textContent = '알림 켜기';
    지금상태();
  });

  끄기.addEventListener('click', async function () {
    지움();
    끄기.disabled = true;
    try {
      var 등록 = await navigator.serviceWorker.getRegistration('./');
      var 구독 = 등록 ? await 등록.pushManager.getSubscription() : null;
      if (구독) {
        await fetch(취소길, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: 구독.endpoint })
        });
        await 구독.unsubscribe();
      }
      알림('이 휴대폰은 이제 알림을 받지 않습니다.', true);
    } catch (e) {
      알림('끄지 못했습니다: ' + (e.message || ''), false);
    }
    끄기.disabled = false;
    지금상태();
  });

  async function 요약읽기() {
    var 칸 = document.getElementById('요약');
    try {
      var 요 = await (await fetch(요약길, { cache: 'no-store' })).json();
      if (!요 || !요.건수) { 칸.textContent = '아직 없습니다.'; return; }
      var 때 = 요.때 ? new Date(요.때).toLocaleString('ko-KR') : '';
      칸.innerHTML = '<b>새 주문 ' + 요.건수 + '건</b> - ' +
        Number(요.금액 || 0).toLocaleString('ko-KR') + '원<br>' +
        (요.줄 ? 요.줄 + '<br>' : '') +
        '<span style="color:var(--더흐림);font-size:12px">' + 때 + '</span>';
    } catch (e) {
      칸.textContent = '서버에서 읽지 못했습니다.';
    }
  }
  document.getElementById('새로').addEventListener('click', 요약읽기);

  지금상태();
  요약읽기();
})();
</script>
</body>
</html>
